{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h3>Income</h3><button class="btn btn-primary" hx-get="{% url 'mill:income-create' %}" hx-target="#modalContent">+ Income</button></div><div class="card p-3 mt-3"><table class="table"><tr><th>Date</th><th>Category</th><th>Title</th><th class="text-end">Amount</th></tr>{% for r in rows %}<tr><td>{{ r.income_date }}</td><td>{{ r.get_category_display }}</td><td>{{ r.title }}</td><td class="text-end">₹{{ r.amount }}</td></tr>{% endfor %}</table></div>{% endblock %}
