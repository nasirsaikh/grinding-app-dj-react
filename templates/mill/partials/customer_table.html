{% load i18n %}<div class="card p-2"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>{% trans 'Customer' %}</th><th>{% trans 'Village' %}</th><th>{% trans 'Mobile' %}</th><th class="text-end">{% trans 'Udhaar' %}</th></tr></thead><tbody>{% for c in customers %}<tr><td><a href="{% url 'mill:customer-detail' c.pk %}" class="fw-semibold text-decoration-none">{{ c.name }}</a></td><td>{{ c.village|default:'—' }}</td><td>{{ c.mobile|default:'—' }}</td><td class="text-end fw-bold {% if c.udhaar_balance > 0 %}text-danger{% endif %}">₹{{ c.udhaar_balance }}</td></tr>{% empty %}<tr><td colspan="4" class="text-center py-4">{% trans 'No customers found' %}</td></tr>{% endfor %}</tbody></table></div></div>
