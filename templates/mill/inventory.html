{% extends 'base.html' %}{% block content %}<h3>Inventory</h3><div class="row g-3 mt-1">{% for x in items %}<div class="col-md-4"><div class="card p-3"><small class="text-secondary">{{ x.get_stock_type_display }}</small><h5>{{ x.name }}</h5><div class="fs-3 fw-bold">{{ x.current_stock }} {{ x.unit }}</div><small>Reorder: {{ x.reorder_level }}</small></div></div>{% endfor %}</div>{% endblock %}
